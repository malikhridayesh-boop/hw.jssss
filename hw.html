<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>array</h1>
    <script>
        var colors = ["white", "black", "Blue", "orange" , "red"]
        document.write("array = ", colors, "<br>")
        document.write("joining of array = ", colors.join("*"), "<br>")
        document.write("removed element = ", colors.pop(), "<br>")
        document.write("array = ", colors, "<br>")
        document.write("total element = ", colors.push("yellow"), "<br>")
        document.write("array = ", colors, "<br>")
    </script>
</body>
</html>
